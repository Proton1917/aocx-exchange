name: Context contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install schema test dependency
        run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Test archive and compiler contracts
        run: python -m unittest discover -s scripts/tests -v
      - name: Exercise the formal example
        run: python assets/examples/compile_example.py --out "$RUNNER_TEMP/aocx-formal"
      - name: Check schema generation
        run: |
          python assets/schemas/build_schemas.py
          git diff --exit-code -- assets/schemas
