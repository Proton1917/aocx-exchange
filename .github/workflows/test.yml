name: Context contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install schema test dependency
        run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Test archive and compiler contracts
        run: python -m unittest discover -s scripts/tests -v
      - name: Exercise the formal example
        run: python assets/examples/compile_example.py --out "$RUNNER_TEMP/aocx-formal"
      - name: Check schema generation
        run: |
          python assets/schemas/build_schemas.py
          git diff --exit-code -- assets/schemas
